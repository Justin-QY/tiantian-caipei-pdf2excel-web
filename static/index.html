<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天天采配清单-PDF转Excel · 网页版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }

  :root {
    --ink: #1b2230;
    --ink-2: #5a6577;
    --ink-3: #8d97a8;
    --accent: #3b6cf6;
    --accent-soft: rgba(59,108,246,.10);
    --ok: #16a37b;
    --warn: #d98324;
    --err: #d9564f;
    --glass: rgba(255,255,255,.55);
    --glass-2: rgba(255,255,255,.46);
    --radius: 16px;
  }

  html, body { min-height: 100%; }
  body {
    background: #eef1f7;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding: 16px;
    display: grid;
    place-items: center;
  }

  .backdrop { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(78px); opacity: .52; }
  .b1 { width: 520px; height: 520px; left: -4%;  top: -16%; background: #a8c4ff; animation: drift 22s ease-in-out infinite; }
  .b2 { width: 480px; height: 480px; right: -2%; top: 2%;   background: #ffcfdd; animation: drift 26s ease-in-out infinite reverse; }
  .b3 { width: 560px; height: 560px; left: 22%;  bottom: -30%; background: #b8efdd; animation: drift 30s ease-in-out infinite; }
  .b4 { width: 380px; height: 380px; right: 12%; bottom: -12%; background: #ddd0ff; animation: drift 24s ease-in-out infinite reverse; }
  @keyframes drift {
    0%,100% { transform: translate3d(0,0,0) scale(1); }
    50%     { transform: translate3d(26px,-22px,0) scale(1.08); }
  }

  .app {
    position: relative; z-index: 1;
    width: min(980px, 100%);
    height: min(700px, calc(100vh - 32px));
    min-height: 540px;
    display: flex; flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 18px;
    box-shadow: 0 18px 60px rgba(26,38,66,.14);
    overflow: hidden;
  }

  .titlebar {
    height: 50px; flex: 0 0 50px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid rgba(255,255,255,.55);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto;
    background: linear-gradient(135deg, #4f7dff, #2f5be0);
    display: grid; place-items: center;
    box-shadow: 0 4px 12px rgba(59,108,246,.30);
  }
  .mark svg { width: 14px; height: 14px; }
  .brand b { font-size: 13.5px; font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .brand span { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .spacer { flex: 1; }
  .note-pill {
    font-size: 11px; color: var(--ink-3); white-space: nowrap;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.9);
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 7px;
    height: 26px; padding: 0 12px; border-radius: 999px;
    background: rgba(255,255,255,.6);
    border: 1px solid rgba(255,255,255,.9);
    font-size: 11.5px; color: var(--ink-2); white-space: nowrap;
    transition: background .25s, border-color .25s, color .25s;
  }
  /* 右上角服务三态：就绪=绿（正常）/ 进行=黄（处理中）/ 异常=红（无法处理）
     文字、圆点、药丸底色一起变，颜色本身即可区分状态 */
  .status-pill[data-state="ready"] { background: rgba(22,163,123,.12); border-color: rgba(22,163,123,.28); color: #0d8263; }
  .status-pill[data-state="busy"]  { background: rgba(227,160,8,.15);  border-color: rgba(227,160,8,.34);  color: #946500; }
  .status-pill[data-state="error"] { background: rgba(217,86,79,.12);  border-color: rgba(217,86,79,.28);  color: #c03d36; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); transition: background .3s; }
  .dot.ready { background: #16a37b; }
  .dot.busy  { background: #e3a008; animation: pulse 1.1s ease-in-out infinite; }
  .dot.error { background: #d9564f; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.75)} }

  .body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 9px 12px 11px; min-height: 0; }

  .card {
    background: var(--glass-2);
    border: 1px solid rgba(255,255,255,.72);
    border-radius: var(--radius);
    box-shadow: 0 2px 10px rgba(26,38,66,.04);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .card-hd { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; }
  .card-hd h2 { font-size: 12.5px; font-weight: 600; letter-spacing: .3px; }
  .card-hd .hint { font-size: 11.5px; color: var(--ink-3); }
  .card-hd .right { margin-left: auto; display: flex; gap: 4px; }

  .ghost {
    background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 11.5px; color: var(--ink-3);
    padding: 4px 8px; border-radius: 7px; transition: all .15s; white-space: nowrap;
  }
  .ghost:hover { background: rgba(255,255,255,.8); color: var(--accent); }
  .ghost:disabled { opacity: .4; cursor: default; }

  .drop {
    margin: 3px 16px 8px; flex: 0 0 auto; height: 84px;
    border-radius: 13px;
    border: 1.5px dashed rgba(59,108,246,.30);
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.24));
    display: flex; align-items: center; justify-content: center; gap: 14px;
    cursor: pointer; transition: all .18s;
  }
  .drop:hover, .drop.over { border-color: rgba(59,108,246,.62); background: rgba(255,255,255,.68); }
  .drop:active { background: var(--accent-soft); }
  .drop .icon { width: 30px; height: 30px; color: var(--accent); opacity: .85; flex: 0 0 auto; }
  .drop .txt p { font-size: 12.5px; color: var(--ink-2); }
  .drop .txt p em { font-style: normal; color: var(--accent); font-weight: 600; }
  .drop .txt small { display: block; margin-top: 4px; font-size: 11px; color: var(--ink-3); }
  .drop.mini { height: 38px; gap: 9px; margin: 2px 16px 6px; }
  .drop.mini .icon { width: 17px; height: 17px; }
  .drop.mini .txt small { display: none; }
  .drop.mini .txt p { font-size: 11.5px; }

  .files { flex: 1; overflow-y: auto; padding: 0 4px 0 10px; min-height: 0; }
  .file { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 10px; transition: background .15s, opacity .15s; }
  .file:hover { background: rgba(255,255,255,.66); }
  .file .cbx { width: 15px; height: 15px; flex: 0 0 auto; margin: 0; cursor: pointer; accent-color: var(--accent); }
  .file.off { opacity: .5; }
  .file.off:hover { opacity: .8; }
  .file .fi {
    width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto;
    background: rgba(217,86,79,.10); color: var(--err);
    display: grid; place-items: center; font-size: 8.5px; font-weight: 700;
  }
  .file .fname { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .fmeta { font-size: 11px; color: var(--ink-3); flex: 0 0 auto; }
  .file .fstate { font-size: 11px; flex: 0 0 auto; padding: 2px 8px; border-radius: 999px; background: rgba(141,151,168,.14); color: var(--ink-3); white-space: nowrap; }
  .file .fstate.run  { background: var(--accent-soft); color: var(--accent); }
  .file .fstate.done { background: rgba(22,163,123,.13); color: var(--ok); }
  .file .fstate.fail { background: rgba(217,86,79,.12); color: var(--err); }
  .file .del { opacity: 0; transition: opacity .15s; }
  .file:hover .del { opacity: 1; }
  .empty { padding: 4px 10px 0; font-size: 11.5px; color: var(--ink-3); }

  .settings {
    flex: 0 0 auto;
    display: flex; flex-direction: column; gap: 6px;
    padding: 7px 16px 8px;
    border-top: 1px solid rgba(255,255,255,.7);
    background: rgba(255,255,255,.26);
    border-radius: 0 0 16px 16px;
  }
  .set-row { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .set-item { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .set-item > label { font-size: 11.5px; color: var(--ink-3); flex: 0 0 auto; }
  .dirwrap { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
  .dirwrap input, .namewrap input {
    width: 100%; min-width: 80px; height: 26px; padding: 0 9px;
    border-radius: 8px; border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.62); font: inherit; font-size: 11.5px; color: var(--ink);
    outline: none; transition: all .16s;
    -webkit-user-select: text; user-select: text;
  }
  .dirwrap input:focus, .namewrap input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-soft); }
  .dirwrap input::placeholder, .namewrap input::placeholder { color: #a8b1c1; }
  .namewrap { flex: 0 0 240px; min-width: 140px; }
  .set-tip { font-size: 11px; color: var(--ink-3); min-width: 0; }
  .chips { display: flex; gap: 5px; flex: 0 0 auto; }
  .chip {
    height: 26px; padding: 0 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.55);
    font: inherit; font-size: 11.5px; color: var(--ink-2);
    cursor: pointer; transition: all .16s; white-space: nowrap;
  }
  .chip:hover { background: rgba(255,255,255,.85); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(59,108,246,.26); }

  .progress-card {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px;
    background: var(--glass-2);
    border: 1px solid rgba(255,255,255,.72);
    border-radius: var(--radius);
  }
  .progress-main { flex: 1; min-width: 0; }
  .progress-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
  .progress-top b { font-size: 12px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .progress-top em { font-style: normal; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .track { height: 6px; border-radius: 999px; background: rgba(141,151,168,.16); overflow: hidden; }
  .bar { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #6d95ff, #3b6cf6); transition: width .25s ease; position: relative; overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: translateX(-100%); }
  .bar.active::after { animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }

  .actions { display: flex; gap: 9px; flex: 0 0 auto; }
  .btn {
    height: 36px; padding: 0 18px; border-radius: 9px;
    font: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; transition: all .16s; white-space: nowrap;
    border: 1px solid rgba(255,255,255,.9);
    background: rgba(255,255,255,.62); color: var(--ink-2);
  }
  .btn:hover:not(:disabled) { background: #fff; color: var(--ink); box-shadow: 0 4px 14px rgba(26,38,66,.08); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(180deg, #4c7bff, #3b6cf6); border-color: transparent; color: #fff; box-shadow: 0 6px 18px rgba(59,108,246,.30); }
  .btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #5b87ff, #3f6ef8); color: #fff; }
  .btn:disabled { opacity: .42; cursor: not-allowed; }

  .log-card { height: 146px; flex: 0 0 146px; display: flex; flex-direction: column; }
  .log-hd { display: flex; align-items: center; gap: 8px; padding: 8px 16px 6px; border-bottom: 1px solid rgba(255,255,255,.6); }
  .log-hd h2 { font-size: 11.5px; font-weight: 600; }
  .log-hd .count { font-size: 11px; color: var(--ink-3); }
  .log-hd .ghost { margin-left: auto; }
  .log-body {
    flex: 1; overflow-y: auto; padding: 6px 10px 8px 16px;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 11px; line-height: 1.6;
    -webkit-user-select: text; user-select: text;
  }
  .log-body div { display: flex; gap: 10px; }
  .log-body time { color: #a8b1c1; flex: 0 0 auto; }
  .log-body .msg { min-width: 0; white-space: pre-wrap; word-break: break-all; }
  .l-info .msg { color: var(--ink-2); }
  .l-ok   .msg { color: var(--ok); }
  .l-warn .msg { color: var(--warn); }
  .l-err  .msg { color: var(--err); }
  .l-dim  .msg { color: var(--ink-3); }

  .log-body::-webkit-scrollbar, .files::-webkit-scrollbar { width: 12px; height: 12px; }
  .log-body::-webkit-scrollbar-track, .files::-webkit-scrollbar-track { background: rgba(120,132,150,.14); border-radius: 6px; margin: 2px; }
  .log-body::-webkit-scrollbar-thumb, .files::-webkit-scrollbar-thumb { background: rgba(70,82,102,.72); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
  .log-body::-webkit-scrollbar-thumb:hover, .files::-webkit-scrollbar-thumb:hover { background: rgba(90,101,119,.75); background-clip: padding-box; }

  .toast {
    position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 12px);
    padding: 9px 17px; border-radius: 10px;
    background: rgba(27,34,48,.92); color: #fff; font-size: 12px;
    opacity: 0; visibility: hidden; transition: all .24s; z-index: 9;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  /* 开始转换前的确认弹框 */
  .modal-mask {
    position: absolute; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: rgba(27,34,48,.26);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; transition: opacity .18s, visibility .18s;
  }
  .modal-mask.show { opacity: 1; visibility: visible; }
  .modal {
    width: min(370px, calc(100% - 40px));
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(255,255,255,.96);
    border-radius: 16px;
    box-shadow: 0 22px 60px rgba(26,38,66,.24);
    padding: 20px 20px 18px;
    transform: translateY(10px) scale(.98);
    transition: transform .2s cubic-bezier(.2,.8,.3,1);
  }
  .modal-mask.show .modal { transform: none; }
  .modal-icon {
    width: 38px; height: 38px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; margin-bottom: 12px;
  }
  .modal-icon svg { width: 19px; height: 19px; }
  .modal h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }
  .modal p { font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .modal .summary {
    margin-top: 12px; padding: 9px 11px; border-radius: 10px;
    background: rgba(59,108,246,.06); border: 1px solid rgba(59,108,246,.12);
    font-size: 11.5px; color: var(--ink-2); line-height: 1.8;
    word-break: break-all;
  }
  .modal .summary b { color: var(--accent); font-weight: 600; }
  .modal-ft { display: flex; gap: 9px; margin-top: 18px; }
  .modal-ft .btn { flex: 1; height: 34px; font-size: 12.5px; }
  /* 两个按钮用明显不同的颜色区分功能：绿色=执行，浅灰=放弃 */
  .btn-go {
    background: linear-gradient(180deg, #23b98b, #16a37b);
    background-color: #16a37b;
    border-color: transparent; color: #fff;
    box-shadow: 0 5px 16px rgba(22,163,123,.28);
  }
  .btn-go:hover:not(:disabled) {
    background: linear-gradient(180deg, #2cc697, #18ac81);
    background-color: #18ac81;
    color: #fff; box-shadow: 0 6px 18px rgba(22,163,123,.34);
  }
  .btn-cancel {
    background: rgba(255,255,255,.85); color: var(--ink-2);
    border-color: rgba(27,34,48,.12);
  }
  .btn-cancel:hover:not(:disabled) { background: #fff; color: var(--ink); box-shadow: 0 4px 14px rgba(26,38,66,.08); }

  @media (max-width: 720px) {
    body { padding: 0; }
    .app { width: 100%; height: 100vh; min-height: 0; border-radius: 0; border: 0; }
    .note-pill { display: none; }
    .namewrap { flex: 1 1 100%; }
    .progress-card { flex-wrap: wrap; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="backdrop">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
</div>

<div class="app">
  <div class="titlebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
        </svg>
      </div>
      <b>天天采配清单-PDF转Excel</b><span>网页版 v1.5</span>
    </div>
    <div class="spacer"></div>
    <div class="note-pill">文件转换完即删除 · 结果保留 30 分钟</div>
    <div class="status-pill" id="statusPill" data-state="ready" title="服务运行正常"><i class="dot ready" id="dot"></i><span id="statusText">就绪</span></div>
  </div>

  <div class="body">
    <div class="card" style="flex:1;">
      <div class="card-hd">
        <h2>待转换文件</h2><span class="hint" id="fileHint">未选择</span>
        <div class="right">
          <button class="ghost" id="btnCheckAll">全选</button>
          <button class="ghost" id="btnFolder">添加文件夹</button>
          <button class="ghost" id="btnClear">清空</button>
        </div>
      </div>

      <div class="drop" id="drop">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5-5 5 5"/><path d="M12 5v12"/>
        </svg>
        <div class="txt">
          <p>点击选择 PDF，或 <em>拖放到这里</em> / 添加整个文件夹</p>
          <small>支持多选 · 仅处理文字版 PDF（天天采配导出）</small>
        </div>
      </div>
      <input type="file" id="fileInput" multiple accept=".pdf,application/pdf" hidden>
      <input type="file" id="dirInput" webkitdirectory directory hidden>

      <div class="files" id="fileList">
        <div class="empty" id="emptyTip">尚未添加文件</div>
      </div>

      <div class="settings">
        <div class="set-row">
          <div class="set-item" style="flex:1; min-width:0;">
            <label>文件名</label>
            <div class="dirwrap">
              <input id="outName" placeholder="留空 = 用原文件名" spellcheck="false">
            </div>
          </div>
          <div class="set-tip" id="nameTip">单文件下载 .xlsx，多文件打包 .zip</div>
        </div>
        <div class="set-row">
          <div class="set-item" id="codeWrap" style="display:none;">
            <label>访问口令</label>
            <div class="namewrap" style="flex:0 0 160px;">
              <input id="accessCode" type="password" placeholder="请输入口令" spellcheck="false">
            </div>
          </div>
          <div class="set-item" style="margin-left:auto;">
            <label>输出</label>
            <div class="chips" id="outChips">
              <button class="chip on" data-mode="single">单工作表</button>
              <button class="chip" data-mode="separate">多工作表</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="progress-card">
      <div class="progress-main">
        <div class="progress-top">
          <b id="taskLabel">等待开始</b>
          <em id="pct">0%</em>
        </div>
        <div class="track"><div class="bar" id="bar"></div></div>
      </div>
      <div class="actions">
        <button class="btn" id="btnDownload" disabled>下载结果</button>
        <button class="btn primary" id="btnStart" disabled>开始转换</button>
      </div>
    </div>

    <div class="card log-card">
      <div class="log-hd">
        <h2>处理日志</h2><span class="count" id="logCount">0 条</span>
        <button class="ghost" id="logClear">清空日志</button>
      </div>
      <div class="log-body" id="log"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-mask" id="confirmMask" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m9 15 2 2 4-4"/>
        </svg>
      </div>
      <h3 id="confirmTitle">是否开始执行转换文件？</h3>
      <p>点击「开始」后将立即上传并处理已勾选的文件，转换过程中请勿关闭页面。</p>
      <div class="summary" id="confirmSummary"></div>
      <div class="modal-ft">
        <button class="btn btn-go" id="confirmGo">开始</button>
        <button class="btn btn-cancel" id="confirmCancel">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
  const $ = s => document.querySelector(s);
  let files = [], busy = false, layout = 'single', runQueue = [];
  let jobId = null, lastSeq = 0, resultUrl = null, resultName = null, polling = false, needCode = false;

  // 子路径部署（如 https://your-domain.com/ttqd/）时自动推导接口前缀；
  // 本地根路径部署时 PATH_BASE 为空，接口仍是 /api/...
  const PATH_BASE = location.pathname.replace(/\/+$/, '');
  const API = PATH_BASE + '/api';
  const apiUrl = p => (typeof p === 'string' && p.indexOf('/api') === 0) ? API + p.slice(4) : p;

  const now = () => new Date().toTimeString().slice(0, 8);
  const esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
  const code = () => ($('#accessCode') ? $('#accessCode').value.trim() : '');
  const authHeaders = () => code() ? { 'X-Access-Code': code() } : {};
  const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

  // 分享链接用 #code=xxx（fragment 不进服务器日志、不进 Referer），也兼容 ?code=xxx
  // 读到后立即从地址栏抹掉，避免口令留在浏览器历史 / 聊天记录里
  (function readLinkCode() {
    let c = '';
    const m = location.hash.match(/(?:^#|&)code=([^&]+)/);
    if (m) c = decodeURIComponent(m[1]);
    if (!c) c = new URLSearchParams(location.search).get('code') || '';
    if (!c) return;
    localStorage.setItem('pdf2xlsx_code', c);
    $('#accessCode').value = c;
    try {
      const u = new URL(location.href);
      u.hash = '';
      u.searchParams.delete('code');
      const q = u.searchParams.toString();
      history.replaceState(null, '', PATH_BASE + '/' + (q ? '?' + q : ''));
    } catch (e) { /* 不支持 replaceState 时忽略 */ }
  })();

  function log(text, level) {
    const el = document.createElement('div');
    el.className = 'l-' + (level || 'info');
    el.innerHTML = '<time>' + now() + '</time><span class="msg">' + esc(text) + '</span>';
    const box = $('#log');
    box.appendChild(el);
    while (box.children.length > 500) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
    $('#logCount').textContent = box.children.length + ' 条';
  }
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400);
  }
  // 右上角只表示「服务状态」，固定三态：
  //   就绪=绿（服务运行正常）/ 进行=黄（服务处理中）/ 异常=红（无法处理）
  // 转换结果、进度、明细仍由进度条和处理日志负责，不占用这三个词。
  const STATUS = {
    ready: { text: '就绪', tip: '服务运行正常' },
    busy:  { text: '进行', tip: '服务处理中' },
    error: { text: '异常', tip: '无法处理，请查看处理日志' }
  };
  let serviceOk = true;   // init 连通性检测的结果，服务连不上时不允许显示绿色就绪
  function setStatus(state, detail) {
    const s = STATUS[state] ? state : 'ready';
    $('#statusText').textContent = STATUS[s].text;
    $('#statusPill').dataset.state = s;
    $('#statusPill').title = detail || STATUS[s].tip;
    $('#dot').className = 'dot ' + s;
  }
  function setReady() {   // 回到空闲态：服务不通就保持红色异常
    if (serviceOk) setStatus('ready');
    else setStatus('error', '服务连接失败，无法处理');
  }
  function setProgress(v, text) {
    $('#bar').style.width = v + '%';
    $('#pct').textContent = (Math.round(v * 10) / 10) + '%';
    if (text) $('#taskLabel').textContent = text;
    $('#bar').classList.toggle('active', v > 0 && v < 100);
  }

  const STATE_TEXT = { wait: '待处理', run: '上传/处理中', done: '已转换', fail: '失败' };
  const checkedCount = () => files.filter(f => f.checked).length;

  function updateStartState() {
    const n = checkedCount();
    $('#fileHint').textContent = files.length ? ('已勾选 ' + n + ' / ' + files.length) : '未选择';
    // 没校验通过的口令时直接禁用，避免点了才发现发不出请求
    const noCode = needCode && !code();
    $('#btnStart').disabled = busy || n === 0 || noCode || !serviceOk;
    $('#btnStart').textContent = busy ? '转换中…'
                               : (!serviceOk ? '服务异常' : (noCode ? '请输入访问口令' : '开始转换'));
    $('#btnStart').title = !serviceOk ? '服务连接失败，无法处理，请稍后刷新页面重试'
                          : (noCode ? '请先在「访问口令」处输入口令'
                          : (n === 0 ? '请先勾选要转换的文件' : ''));
  }
  // 手输口令时实时恢复按钮，不用刷新页面
  $('#accessCode').addEventListener('input', updateStartState);

  // 转换输入一旦变化，上一次生成的结果文件就不再对应当前列表/设置。
  // 不失效的话，移除文件后点「下载结果」会把已删除的文件又下载出来。
  function invalidateResult(reason) {
    if (busy || !resultUrl) return;
    resultUrl = null;
    resultName = null;
    $('#btnDownload').disabled = true;
    log('上次转换结果已失效（' + reason + '），请重新转换', 'warn');
  }

  function render() {
    const list = $('#fileList');
    list.querySelectorAll('.file').forEach(n => n.remove());
    $('#emptyTip').style.display = files.length ? 'none' : 'block';
    $('#drop').classList.toggle('mini', files.length > 0);
    files.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'file' + (f.checked ? '' : ' off');
      el.title = f.name;
      el.innerHTML =
        '<input type="checkbox" class="cbx" data-i="' + i + '"' + (f.checked ? ' checked' : '') + '>' +
        '<div class="fi">PDF</div>' +
        '<div class="fname">' + esc(f.name) + '</div>' +
        '<div class="fmeta">' + esc(fmtSize(f.file.size)) + '</div>' +
        '<div class="fstate ' + f.state + '">' + STATE_TEXT[f.state] + '</div>' +
        '<button class="ghost del" data-i="' + i + '">移除</button>';
      list.appendChild(el);
    });
    list.querySelectorAll('.cbx').forEach(cb => {
      cb.onchange = () => {
        if (busy) { cb.checked = !cb.checked; return; }
        files[+cb.dataset.i].checked = cb.checked;
        render();
        invalidateResult('勾选已变更');
      };
    });
    list.querySelectorAll('.del').forEach(b => {
      b.onclick = () => {
        if (busy) return;
        files.splice(+b.dataset.i, 1);
        render();
        invalidateResult('移除了文件');
      };
    });
    updateStartState();
  }

  function addFiles(incoming) {
    let added = 0, skipped = 0;
    Array.from(incoming || []).forEach(f => {
      if (!f || !f.name.toLowerCase().endsWith('.pdf')) { skipped++; return; }
      const key = f.name + '|' + f.size;
      if (files.some(x => x.key === key)) return;
      files.push({ key, file: f, name: f.name, state: 'wait', checked: true });
      added++;
    });
    render();
    if (added) {
      setReady();
      log('已添加 ' + added + ' 个文件（默认勾选），当前共 ' + files.length + ' 个', 'info');
    }
    if (skipped) log('已忽略 ' + skipped + ' 个非 PDF 文件', 'warn');
    if (added) invalidateResult('新增了文件');
  }

  $('#drop').onclick = () => { if (!busy) $('#fileInput').click(); };
  $('#fileInput').onchange = e => { if (!busy) addFiles(e.target.files); e.target.value = ''; };
  $('#btnFolder').onclick = () => { if (!busy) $('#dirInput').click(); };
  $('#dirInput').onchange = e => { if (!busy) addFiles(e.target.files); e.target.value = ''; };

  ['dragenter', 'dragover'].forEach(t => $('#drop').addEventListener(t, e => {
    e.preventDefault(); e.stopPropagation();
    if (!busy) $('#drop').classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(t => $('#drop').addEventListener(t, e => {
    e.preventDefault(); e.stopPropagation(); $('#drop').classList.remove('over');
  }));
  $('#drop').addEventListener('drop', e => {
    if (!busy && e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });

  $('#btnClear').onclick = () => {
    if (busy) return;
    const hadResult = !!resultUrl;
    files = []; render(); setReady(); setProgress(0, '等待开始');
    resultUrl = null; resultName = null; $('#btnDownload').disabled = true;
    log(hadResult ? '已清空文件列表，上次转换结果已失效' : '已清空文件列表', 'dim');
  };
  $('#btnCheckAll').onclick = () => {
    if (busy || !files.length) return;
    const all = files.every(f => f.checked);
    files.forEach(f => f.checked = !all);
    render();
    log(all ? '已取消全部勾选' : '已勾选全部文件', 'dim');
    invalidateResult('勾选已变更');
  };
  document.querySelectorAll('#outChips .chip').forEach(c => {
    c.onclick = () => {
      if (busy) return;
      document.querySelectorAll('#outChips .chip').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      layout = c.dataset.mode;
      invalidateResult('输出方式已变更');
    };
  });
  $('#outName').addEventListener('input', () => invalidateResult('文件名已变更'));

  // 自定义确认弹框（不用原生 confirm：按钮文字和颜色都要可控）
  let confirmOpen = false;
  function confirmStart() {
    return new Promise(resolve => {
      if (confirmOpen) { resolve(false); return; }
      confirmOpen = true;
      const n = checkedCount();
      $('#confirmSummary').innerHTML =
        '已勾选 <b>' + n + '</b> 个 PDF · 输出：<b>' +
        (layout === 'single' ? '单工作表' : '多工作表') + '</b><br>' +
        '文件名：<b>' + esc($('#outName').value.trim() || '沿用原文件名') + '</b>';
      const mask = $('#confirmMask');
      mask.classList.add('show');
      $('#confirmGo').focus();

      function close(ok) {
        if (!confirmOpen) return;
        confirmOpen = false;
        mask.classList.remove('show');
        $('#confirmGo').onclick = null;
        $('#confirmCancel').onclick = null;
        mask.onclick = null;
        document.removeEventListener('keydown', onKey);
        resolve(ok);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); close(false); }
        else if (e.key === 'Enter') { e.preventDefault(); close(true); }
      }
      $('#confirmGo').onclick = () => close(true);
      $('#confirmCancel').onclick = () => close(false);
      mask.onclick = e => { if (e.target === mask) close(false); };
      document.addEventListener('keydown', onKey);
    });
  }

  async function start() {
    if (busy) return;
    const chosen = files.filter(f => f.checked);
    if (!chosen.length) { toast('请先勾选要转换的文件'); log('未勾选任何文件，无法开始转换', 'err'); return; }
    if (needCode && !code()) { toast('请输入访问口令'); log('无法开始：未填写访问口令', 'err'); $('#accessCode').focus(); return; }

    const confirmed = await confirmStart();
    if (!confirmed) { log('已取消转换，未提交任务', 'dim'); toast('已取消转换'); return; }
    if (busy) return;   // 弹框停留期间若已有任务启动，不再重复提交

    busy = true;
    $('#btnStart').disabled = true;
    $('#btnStart').textContent = '转换中…';
    $('#btnFolder').disabled = true;
    $('#btnDownload').disabled = true;
    resultUrl = null;
    chosen.forEach(f => f.state = 'wait');
    render();
    setStatus('busy');
    setProgress(0, '准备中');
    log('='.repeat(40), 'dim');

    const fd = new FormData();
    chosen.forEach(f => fd.append('files', f.file, f.name));
    fd.append('layout', layout);
    fd.append('name', $('#outName').value.trim());

    runQueue = chosen;
    lastSeq = 0;
    const headers = authHeaders();

    try {
      const res = await fetch(API + '/jobs', { method: 'POST', body: fd, headers });
      // nginx 层拒绝时返回的是 HTML 错误页，不能无脑 res.json()
      if (!res.ok) {
        if (res.status === 403) throw new Error('访问口令错误或未授权，请检查口令');
        if (res.status === 429) throw new Error('操作太频繁，请稍后再试（单 IP 限流）');
        if (res.status === 413) throw new Error('文件太大，超过上传上限');
        throw new Error('HTTP ' + res.status);
      }
      const data = await res.json();
      if (!data.ok) throw new Error(data.msg || '任务创建失败');
      jobId = data.id;
      localStorage.setItem('pdf2xlsx_code', code());
      log('任务已创建：' + jobId, 'ok');
      poll();
    } catch (e) {
      log('启动失败：' + e.message, 'err');
      toast('启动失败：' + e.message);
      finish(false);
    }
  }
  $('#btnStart').onclick = start;

  function finish(success) {
    busy = false;
    $('#btnStart').textContent = '开始转换';
    $('#btnFolder').disabled = false;
    $('#bar').classList.remove('active');
    updateStartState();
    runQueue = [];
    if (!success) setStatus('error', '任务启动失败，无法处理');
  }

  async function downloadResult() {
    if (!resultUrl) { toast('还没有可下载的结果'); return; }
    try {
      const res = await fetch(resultUrl, { headers: authHeaders() });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = resultName || '转换结果.xlsx';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 30000);
      log('已开始下载：' + a.download, 'ok');
    } catch (e) {
      log('下载失败：' + e.message, 'err');
      toast('下载失败，请点击「下载结果」重试');
    }
  }
  $('#btnDownload').onclick = downloadResult;

  function onDone(ev) {
    finish(true);
    if (ev.fail === 0) {
      setReady();
      setProgress(100, '转换完成：成功 ' + ev.ok + ' 个');
      log('转换完成：成功 ' + ev.ok + ' 个', 'ok');
      toast('转换完成，成功 ' + ev.ok + ' 个');
    } else if (ev.ok === 0) {
      setStatus('error', '全部文件转换失败，无法处理');
      $('#taskLabel').textContent = '转换失败';
      log('全部失败，请查看日志', 'err');
      toast('转换失败，请查看日志');
    } else {
      setStatus('error', '有 ' + ev.fail + ' 个文件转换失败，请查看日志');
      $('#taskLabel').textContent = '完成：成功 ' + ev.ok + '，失败 ' + ev.fail;
      log('部分完成：成功 ' + ev.ok + '，失败 ' + ev.fail, 'warn');
      toast('部分完成，成功 ' + ev.ok + ' 个');
    }
    (ev.errs || []).forEach(e => log('失败明细：' + e, 'err'));
    if (ev.download) {
      resultUrl = apiUrl(ev.download);   // 后端返回 /api/download/xxx，子路径部署时补前缀
      resultName = ev.filename;
      $('#btnDownload').disabled = false;
      log('结果文件：' + ev.filename + '（30 分钟内可重新下载）', 'dim');
      downloadResult();
    }
  }

  function handleEvents(evs) {
    evs.forEach(ev => {
      if (ev.type === 'log') log(ev.text, ev.level);
      else if (ev.type === 'progress') setProgress(ev.value, ev.text);
      else if (ev.type === 'file_state') {
        if (runQueue[ev.index]) { runQueue[ev.index].state = ev.state; render(); }
      } else if (ev.type === 'done') onDone(ev);
    });
  }

  async function poll() {
    if (polling || !jobId) return;
    polling = true;
    try {
      const res = await fetch(API + '/jobs/' + jobId + '/events?after=' + lastSeq,
                              { headers: authHeaders() });
      const data = await res.json();
      if (data.ok) {
        (data.events || []).forEach(e => { if (e.seq > lastSeq) lastSeq = e.seq; });
        if (data.events && data.events.length) handleEvents(data.events);
        if (!data.busy) jobId = null;
      } else if (res.status === 403) {
        log('访问口令错误，请检查口令后重试', 'err'); jobId = null;
        finish(false); setStatus('error', '访问口令错误，无法处理');
      } else if (res.status === 404) {
        log('任务已过期', 'err'); jobId = null;
        finish(false); setStatus('error', '任务已过期，无法处理');
      }
    } catch (e) { /* 网络抖动，下轮继续 */ }
    polling = false;
    if (jobId) setTimeout(poll, 180);
  }

  $('#logClear').onclick = () => { $('#log').innerHTML = ''; $('#logCount').textContent = '0 条'; };

  (async function init() {
    try {
      // 先把本地保存 / 链接带入的口令填进输入框，config 请求才能带上它做校验
      $('#accessCode').value = localStorage.getItem('pdf2xlsx_code') || $('#accessCode').value || '';
      const cfg = await (await fetch(API + '/config', { headers: authHeaders() })).json();
      needCode = !!cfg.needCode;
      if (needCode) {
        if (cfg.codeOk !== false && code()) {
          $('#codeWrap').style.display = 'none';          // 链接已授权，不用再手输
          log('访问口令校验通过（链接授权）', 'ok');
        } else {
          $('#codeWrap').style.display = 'flex';
          if (code()) log('链接口令无效，请在「访问口令」处重新输入', 'warn');
          else log('本服务需要访问口令，请在「访问口令」处输入', 'warn');
        }
      }
      serviceOk = true;
      setReady();
      log('解析引擎就绪（网页版 ' + cfg.version + '）', 'ok');
      log('单个文件最大 ' + cfg.maxUploadMB + ' MB · 请添加天天采配导出的 PDF 清单文件', 'dim');
    } catch (e) {
      serviceOk = false;
      setStatus('error', '服务连接失败：' + e.message);
      log('服务连接失败：' + e.message, 'err');
    }
    updateStartState();
  })();
</script>
</body>
</html>
